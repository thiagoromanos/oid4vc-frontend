version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: oid4vci-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - frontend-oid4vci-net

  app:
    image: ghcr.io/thiagoromanos/oid4vc-frontend:beta1
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: acapy-oid4vc-frontent
    restart: always
    ports:
      - "${EXTERNAL_FRONTEND_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/oid4vci
      - ACAPY_URL=http://host.docker.internal:8021
    depends_on:
      - mongodb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - frontend-oid4vci-net

networks:
  frontend-oid4vci-net:
    driver: bridge
    name: ${NETWORK_NAME:-frontend-oid4vci-net}
    external: ${NETWORK_EXTERNAL:-false}
      

volumes:
  mongo_data:
    driver: local
