#version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: oid4vci-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - frontend-oid4vci-net

  backend:
    image: ghcr.io/thiagoromanos/oid4vc-backend:beta1
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oid4vci-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/oid4vci
      - ACAPY_URL=http://host.docker.internal:8021
      # Auth-Server defaults — uncomment and set to pre-populate the UI config
      #- AUTH_SERVER_URL=http://auth-server:9000
      #- AUTH_SERVER_ADMIN_TOKEN=changeme
      #- AUTH_SERVER_PUBLIC_URL=https://your-ngrok-url.io
      #- AUTH_SERVER_PRIVATE_URL=http://auth-server:9001
      #- TENANT_SECRET=changeme
    env_file:
      - .env

    depends_on:
      - mongodb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - frontend-oid4vci-net

  frontend:
    image: ghcr.io/thiagoromanos/oid4vc-frontend-ui:beta1
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: oid4vci-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${EXTERNAL_FRONTEND_PORT:-5000}:80"
    networks:
      - frontend-oid4vci-net

networks:
  frontend-oid4vci-net:
    driver: bridge
    name: ${NETWORK_NAME:-frontend-oid4vci-net}
    external: ${NETWORK_EXTERNAL:-false}
      

volumes:
  mongo_data:
    driver: local
